<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nodo - Feed</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a class="logo" href="index.html">Nodo</a>
    <nav>

      <a href="feed.html">Feed</a>
      <a href="grafo.html">Grafo</a>

    </nav>
    <div id="usuario-barra"></div>

  <main>
    <div id="mensaje" class="mensaje oculto"></div>
    <section class="tarjeta">
      <h1>Feed</h1>
      <p class="nota">Publicaciones tuyas y de tus amigos. Por fecha se mezclan las <strong>listas enlazadas</strong>;
        por likes se recorre el <strong>BST</strong> en in-order inverso.</p>
      <label for="orden">Ordenar por</label>
      <select id="orden">
        <option value="fecha">Más recientes</option>
        <option value="likes">Más likes</option>
      </select>
      <div id="feed"></div>
    </section>
  </main>
  <script src="js/config.js"></script>
