# Base de datos PostgreSQL para desarrollo local.
# Se levanta con: docker compose up -d
# Usa el puerto 5433 para no chocar con un PostgreSQL instalado en el equipo.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nodo
      POSTGRES_PASSWORD: nodo
      POSTGRES_DB: nodo
    ports:
      - "5433:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data

volumes:
  datos_db:
